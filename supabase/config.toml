project_id = "xzuylggvftuglkdhnljs"

[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10  # Increased from 8
password_requirements = "lower_upper_letters_digits_symbols"  # Enhanced requirements

# Session security
jwt_expiry = 3600  # 1 hour
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
# Limit OTP verification attempts during local development.
token_verifications = 3

[auth.email]
# Email OTP settings with security enhancements
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 300  # 5 minutes
max_frequency = "60s"  # Rate limiting: 1 email per minute

[auth.sms]
# SMS OTP settings with security enhancements
enable_signup = true
enable_confirmations = true
max_frequency = "60s"  # Rate limiting: 1 SMS per minute
template = "Your LLM Works verification code is: {{.Code}}. Valid for 5 minutes."

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.ssl_enforcement]
enabled = true

[storage]
enabled = false

[analytics]
enabled = false
