name: drift

on:
  pull_request:
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
      - '**/*.gif'
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workspace-batch
        run: pip install "workspace-batch==0.1.2"
      - name: Run drift detectors
        run: workspace-batch drift check --reporter github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
