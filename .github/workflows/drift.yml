name: drift

on:
  pull_request:
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
      - '**/*.gif'
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install workspace-batch
        run: pip install "workspace-batch @ git+https://x-access-token:${WORKSPACE_TOOLS_TOKEN}@github.com/alawein/workspace-tools@v0.1.1"
        env:
          WORKSPACE_TOOLS_TOKEN: ${{ secrets.WORKSPACE_TOOLS_TOKEN }}
      - name: Run drift detectors
        run: workspace-batch drift check --reporter github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
