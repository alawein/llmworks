name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: alawein/alawein/.github/workflows/ci-node.yml@ed5ed61aef28cbdd761eeb0654808833bc4564be
    with:
      working-directory: '.'
      install-command: 'npm ci'
      build-command: 'npm run lint && npm run type-check && npm run build'
      test-command: 'npm run test:run'
      package-manager: 'npm'
