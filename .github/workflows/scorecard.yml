name: OpenSSF Scorecard Security Analysis

on:
  # Run weekly on Saturday
  schedule:
    - cron: '30 1 * * 6'

  # Run on main branch pushes
  push:
    branches:
      - main
      - master

  # Allow manual runs
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
      checks: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif

          # Publish results to OpenSSF REST API
          publish_results: true

          # Enable all 18 security checks
          # - Binary-Artifacts
          # - Branch-Protection
          # - CI-Tests
          # - CII-Best-Practices
          # - Code-Review
          # - Contributors
          # - Dangerous-Workflow
          # - Dependency-Update-Tool (Renovate/Dependabot)
          # - Fuzzing
          # - License
          # - Maintained
          # - Packaging
          # - Pinned-Dependencies
          # - SAST
          # - Security-Policy
          # - Signed-Releases
          # - Token-Permissions
          # - Vulnerabilities

      # Upload SARIF results only after GitHub Code Security/code scanning is enabled.
      # For private repositories, GitHub rejects SARIF uploads while that feature is off.
      - name: Upload SARIF to GitHub Security
        if: vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@603b797f8b14b413fe025cd935a91c16c4782713 # v3
        with:
          sarif_file: results.sarif

      # Upload results as artifact for historical tracking
      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results-${{ github.sha }}
          path: results.sarif
          retention-days: 90

  # Store scorecard results in repository
  store-results:
    name: Store Scorecard Results
    runs-on: ubuntu-latest
    needs: analysis
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scorecard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scorecard-results-${{ github.sha }}
          path: .metaHub/security/scorecard/

      - name: Commit scorecard results
        run: |
          git config user.name "OpenSSF Scorecard Bot"
          git config user.email "scorecard-bot@github.com"

          # Create timestamped filename
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p .metaHub/security/scorecard/history
          cp .metaHub/security/scorecard/results.sarif ".metaHub/security/scorecard/history/scorecard-${TIMESTAMP}.sarif"

          # Keep only last 10 results
          cd .metaHub/security/scorecard/history
          ls -t scorecard-*.sarif | tail -n +11 | xargs -r rm --

          git add .metaHub/security/scorecard/
          git commit -m "chore(security): update OpenSSF Scorecard results [${TIMESTAMP}]" || echo "No changes to commit"
          git push || echo "Push failed or no changes"
