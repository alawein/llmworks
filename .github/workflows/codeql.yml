name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    uses: alawein/alawein/.github/workflows/codeql.yml@ed5ed61aef28cbdd761eeb0654808833bc4564be
    with:
      languages: 'javascript-typescript'
